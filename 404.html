<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page introuvable — Ardoise</title>
<meta name="theme-color" content="#F2F0EA" media="(prefers-color-scheme: light)">

<link rel="icon" href="icons/ardoise.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<!-- GitHub Pages sert ce fichier pour toute adresse inconnue sous /Ardoise/.
     Sans lui, une URL mal recopiée tombe sur la page d'erreur générique de
     GitHub, qui ne dit pas comment revenir dans l'app. -->
</head>
<body>
  <div class="connexion">
    <div class="connexion__marque">
      <span aria-hidden="true" style="display:inline-flex">
        <svg width="44" height="44" viewBox="0 0 512 512">
          <rect width="512" height="512" rx="110" fill="#14403C"/>
          <path fill="#F2F0EA" d="M125.5 251.3 L202.4 322 L388.5 141.3 A10 10 0 0 1 403.5 154.7
                L217.2 389.9 L98.5 280.7 A20 20 0 0 1 125.5 251.3 Z"/>
        </svg>
      </span>
      <span class="connexion__nom">Ardoise</span>
    </div>
    <p class="connexion__intro">Cette adresse ne mène nulle part. L’ardoise, elle, est juste à côté.</p>
    <a class="bouton bouton--plein" href="./">Revenir à l’ardoise</a>
  </div>
</body>
</html>
